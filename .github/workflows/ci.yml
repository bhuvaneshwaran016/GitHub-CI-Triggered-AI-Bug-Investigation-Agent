name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Code Integrity & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Syntax & Static Compilation Check
        run: |
          echo "Checking Python syntax and structure..."
          python -m py_compile server.py main.py analyzer.py auth_db.py
          echo "All Python modules compiled successfully with zero syntax errors!"

      - name: 5. Run Automated Pytest Test Suite
        run: |
          echo "Running unit and integration tests..."
          pytest test_auth_db.py test_project_explanation.py -v
