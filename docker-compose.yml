version: '3.8'

services:
  web:
    build: .
    container_name: ci_agent_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./users.db:/app/users.db
      - ./analysis_workspace:/app/analysis_workspace
    restart: unless-stopped
